# Agent 上下文窗口配置，可通过环境变量覆盖默认值。
agent:
  context:
    system-prompt: "${AGENT_SYSTEM_PROMPT:You are a helpful AI assistant.}"
    max-recent-messages: "${AGENT_MAX_RECENT_MESSAGES:20}"
    compression-threshold: "${AGENT_COMPRESSION_THRESHOLD:40}"
    max-summary-characters: "${AGENT_MAX_SUMMARY_CHARACTERS:4000}"

# 百炼连接信息全部来自外部配置；API Key 没有仓库内默认值。
llm:
  provider: bailian
  model: "${BAILIAN_MODEL:qwen-plus}"
  base-url: "${BAILIAN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}"
  api-key: "${DASHSCOPE_API_KEY:}"
  connect-timeout: 10s
  read-timeout: 60s
